<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-container">
        <div class="header-control">
            <h1>J.A.R.V.I.S.</h1>
            <div class="header-buttons">
                <button type="button" id="spike-btn" title="Conectar LEGO SPIKE">🤖 SPIKE: DESCONECTADO</button>
                <button type="button" id="mute-btn" title="Alternar Voz">🔊 Voz: LIGADA</button>
            </div>
        </div>
        
        <div class="user-config">
            <div class="config-group">
                <label for="username">Seu Nome:</label>
                <input type="text" id="username" placeholder="Digite seu nome (ex: Senhor Stark)">
            </div>
            
            <div class="config-group">
                <label for="jarvis-mode">Modo de Operação:</label>
                <select id="jarvis-mode">
                    <option value="default">Padrão (Cortês e Direto)</option>
                    <option value="robot">Controle de Robótica (SPIKE Prime)</option>
                    <option value="brief">Resumido (Respostas Curtas)</option>
                    <option value="coder">Programador (Foco em Código e Lógica)</option>
                </select>
            </div>
        </div>

        <div id="chat-log" class="chat-log"></div>

        <form id="chat-form">
            <input type="text" id="user-input" placeholder="Digite ou ordene um comando..." autocomplete="off">
            <button type="button" id="mic-btn" title="Falar pelo microfone">🎤</button>
            <button type="submit">Enviar</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
