<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0f1d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>JARVIS System</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #050811;
      color: #00f0ff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    header {
      padding: 16px;
      text-align: center;
      border-bottom: 1px solid rgba(0, 240, 255, 0.2);
      background: rgba(10, 15, 29, 0.8);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header h1 {
      font-size: 1.2rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
    }

    .status-badge {
      display: inline-block;
      margin-top: 6px;
      font-size: 0.75rem;
      color: #70a1ff;
      letter-spacing: 1px;
    }

    .voice-selector {
      margin-top: 10px;
      width: 90%;
      max-width: 320px;
      background: rgba(5, 8, 17, 0.9);
      color: #00f0ff;
      border: 1px solid rgba(0, 240, 255, 0.4);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.8rem;
      outline: none;
      cursor: pointer;
      text-overflow: ellipsis;
    }

    .voice-selector option {
      background: #050811;
      color: #00f0ff;
    }

    #chat-container {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .user-msg {
      align-self: flex-end;
      background: rgba(0, 240, 255, 0.15);
      border: 1px solid rgba(0, 240, 255, 0.4);
      color: #ffffff;
      border-bottom-right-radius: 2px;
    }

    .jarvis-msg {
      align-self: flex-start;
      background: rgba(15, 25, 45, 0.8);
      border: 1px solid rgba(0, 240, 255, 0.2);
      color: #00f0ff;
      border-bottom-left-radius: 2px;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.05);
    }

    #controls {
      padding: 16px;
      background: rgba(10, 15, 29, 0.9);
      border-top: 1px solid rgba(0, 240, 255, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .input-row {
      display: flex;
      width: 100%;
      gap: 8px;
    }

    input[type="text"] {
      flex: 1;
      background: rgba(5, 8, 17, 0.8);
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 8px;
      padding: 12px;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #00f0ff;
      box-shadow: 0 0 8px rgba(0, 240, 255, 0.3);
    }

    button.send-btn {
      background: #00f0ff;
      border: none;
      color: #050811;
      padding: 0 16px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .mic-btn {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0,240,255,0.2) 0%, rgba(5,8,17,1) 70%);
      border: 2px solid #00f0ff;
      color: #00f0ff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
      transition: all 0.3s ease;
    }

    .mic-btn.listening {
      border-color: #ff3366;
      color: #ff3366;
      box-shadow: 0 0 25px rgba(255, 51, 102, 0.8);
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    .mic-btn svg {
      width: 28px;
      height: 28px;
      fill: currentColor;
    }
  </style>
</head>
<body>

  <header>
    <h1>JARVIS</h1>
    <div class="status-badge" id="status">SISTEMA PRONTO</div>
    <select id="voiceSelect" class="voice-selector" aria-label="Selecione a voz"></select>
  </header>

  <div id="chat-container">
    <div class="message jarvis-msg">
      Sistemas online, Senhor Gerber. Como posso ajudar?
    </div>
  </div>

  <div id="controls">
    <button class="mic-btn" id="micBtn" aria-label="Ativar microfone">
      <svg viewBox="0 0 24 24">
        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
      </svg>
    </button>

    <div class="input-row">
      <input type="text" id="userInput" placeholder="Digite um comando..." autocomplete="off">
      <button class="send-btn" id="sendBtn">Enviar</button>
    </div>
  </div>

  <script>
    const chatContainer = document.getElementById('chat-container');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const micBtn = document.getElementById('micBtn');
    const statusBadge = document.getElementById('status');
    const voiceSelect = document.getElementById('voiceSelect');

    const STORAGE_HISTORICO_API = 'jarvis_historico_api';
    const STORAGE_HISTORICO_CHAT = 'jarvis_historico_chat';

    let historicoConversa = JSON.parse(localStorage.getItem(STORAGE_HISTORICO_API)) || [];
    let historicoChatVisual = JSON.parse(localStorage.getItem(STORAGE_HISTORICO_CHAT)) || [];

    let listaVozes = [];

    function carregarVozes() {
      if ('speechSynthesis' in window) {
        listaVozes = window.speechSynthesis.getVoices();
        voiceSelect.innerHTML = '';

        const vozesPt = listaVozes.filter(v => v.lang.includes('pt'));

        if (vozesPt.length === 0) {
          const option = document.createElement('option');
          option.textContent = 'Nenhuma voz em PT encontrada';
          voiceSelect.appendChild(option);
          return;
        }

        vozesPt.forEach((voz) => {
          const option = document.createElement('option');
          option.textContent = `${voz.name} (${voz.lang})`;
          option.setAttribute('data-name', voz.name);
          option.setAttribute('data-lang', voz.lang);
          
          if (voz.name.includes('Google') || voz.name.toLowerCase().includes('natural')) {
            option.selected = true;
          }
          
          voiceSelect.appendChild(option);
        });
      }
    }

    if ('speechSynthesis' in window) {
      carregarVozes();
      window.speechSynthesis.onvoiceschanged = carregarVozes;
    }

    function salvarNoLocalStorage() {
      localStorage.setItem(STORAGE_HISTORICO_API, JSON.stringify(historicoConversa));
      localStorage.setItem(STORAGE_HISTORICO_CHAT, JSON.stringify(historicoChatVisual));
    }

    function carregarMensagensSalvas() {
      if (historicoChatVisual.length > 0) {
        chatContainer.innerHTML = '';
        historicoChatVisual.forEach(item => {
          renderizarMensagemNaTela(item.text, item.sender);
        });
      }
    }

    function falar(texto) {
      if ('speechSynthesis' in window && texto.trim()) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(texto);

        const selectedOption = voiceSelect.selectedOptions[0]?.getAttribute('data-name');
        if (selectedOption) {
          const vozEscolhida = listaVozes.find(v => v.name === selectedOption);
          if (vozEscolhida) utterance.voice = vozEscolhida;
        }

        utterance.lang = 'pt-BR';
        utterance.rate = 1.3;
        utterance.pitch = 0.85;
        window.speechSynthesis.speak(utterance);
      }
    }

    function renderizarMensagemNaTela(text, sender) {
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message', sender === 'user' ? 'user-msg' : 'jarvis-msg');
      msgDiv.innerText = text;
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return msgDiv;
    }

    function addMessage(text, sender) {
      renderizarMensagemNaTela(text, sender);
      historicoChatVisual.push({ text, sender });
      salvarNoLocalStorage();
    }

    function limparMemoria() {
      localStorage.removeItem(STORAGE_HISTORICO_API);
      localStorage.removeItem(STORAGE_HISTORICO_CHAT);
      historicoConversa = [];
      historicoChatVisual = [];
      chatContainer.innerHTML = `
        <div class="message jarvis-msg">
          Memória reiniciada, Senhor Gerber. Como posso ajudar?
        </div>
      `;
    }

    async function processarComando(comando) {
      if (!comando.trim()) return;

      if (comando.toLowerCase().trim() === 'limpar memória' || comando.toLowerCase().trim() === '/clear') {
        userInput.value = '';
        limparMemoria();
        return;
      }

      addMessage(comando, 'user');
      userInput.value = '';
      statusBadge.innerText = 'PENSANDO...';

      historicoConversa.push({
        role: 'user',
        parts: [{ text: comando }]
      });

      if (historicoConversa.length > 6) {
        historicoConversa = historicoConversa.slice(-6);
      }

      const jarvisMsgElement = renderizarMensagemNaTela('', 'jarvis');
      let respostaCompleta = '';

      try {
        const response = await fetch('/api/chatjs', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ historico: historicoConversa })
        });

        if (!response.ok) {
          throw new Error(`Erro HTTP ${response.status}`);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder('utf-8');
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop();

          for (const line of lines) {
            if (line.startsWith('data: ')) {
              const jsonStr = line.replace('data: ', '').trim();
              if (!jsonStr) continue;

              try {
                const parsed = JSON.parse(jsonStr);

                if (parsed.error) {
                  throw new Error(parsed.error);
                }

                const textoChunk = parsed.candidates?.[0]?.content?.parts?.[0]?.text;
                if (textoChunk) {
                  respostaCompleta += textoChunk;
                  jarvisMsgElement.innerText = respostaCompleta;
                  chatContainer.scrollTop = chatContainer.scrollHeight;
                }
              } catch (e) {
                // Ignora erros pontuais de JSON parcial no stream
              }
            }
          }
        }

        if (respostaCompleta) {
          historicoConversa.push({
            role: 'model',
            parts: [{ text: respostaCompleta }]
          });
          historicoChatVisual.push({ text: respostaCompleta, sender: 'jarvis' });
          salvarNoLocalStorage();

          falar(respostaCompleta);
        }

      } catch (error) {
        historicoConversa.pop();
        salvarNoLocalStorage();
        jarvisMsgElement.innerText = `Erro no sistema: ${error.message}`;
      } finally {
        statusBadge.innerText = 'SISTEMA PRONTO';
      }
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.lang = 'pt-BR';
      recognition.continuous = false;
      recognition.interimResults = false;

      let isListening = false;

      micBtn.addEventListener('click', () => {
        if (isListening) {
          recognition.stop();
        } else {
          recognition.start();
        }
      });

      recognition.onstart = () => {
        isListening = true;
        micBtn.classList.add('listening');
        statusBadge.innerText = 'OUVINDO...';
      };

      recognition.onend = () => {
        isListening = false;
        micBtn.classList.remove('listening');
        statusBadge.innerText = 'SISTEMA PRONTO';
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        processarComando(transcript);
      };

      recognition.onerror = (event) => {
        console.error('Erro de voz:', event.error);
        statusBadge.innerText = 'ERRO DE VOZ';
      };
    } else {
      micBtn.style.display = 'none';
      statusBadge.innerText = 'RECONHECIMENTO DE VOZ NÃO SUPORTADO';
    }

    sendBtn.addEventListener('click', () => processarComando(userInput.value));
    userInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') processarComando(userInput.value);
    });

    carregarMensagensSalvas();
  </script>
</body>
</html>
